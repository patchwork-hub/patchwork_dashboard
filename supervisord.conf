[supervisord]
nodaemon=true
directory=/usr/app

[program:sidekiq]
command=bundle exec sidekiq -C config/sidekiq.yml
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=bundle exec puma
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Task-local collector. Do not publish port 9394 outside the container.
[program:prometheus_exporter]
command=bundle exec prometheus_exporter --bind 127.0.0.1 --port 9394
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0