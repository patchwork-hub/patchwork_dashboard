name: Required status checks

on:
  merge_group:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub workflows
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check  
          fail_level: error

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - lint-workflows
    if: ${{ always() }}
    steps:
      - name: Verify required checks
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          LINT_WORKFLOWS_RESULT: ${{ needs.lint-workflows.result }}
        run: |
          echo "dependency-review: ${DEPENDENCY_REVIEW_RESULT}"
          echo "lint-workflows: ${LINT_WORKFLOWS_RESULT}"

          if [ "${DEPENDENCY_REVIEW_RESULT}" != "success" ] || \
             [ "${LINT_WORKFLOWS_RESULT}" != "success" ]; then
            echo "One or more required checks did not succeed."
            exit 1
          fi

          echo "All required status checks completed successfully."