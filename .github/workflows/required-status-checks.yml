name: Required status checks

on:
  merge_group:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true

      - name: Install bundle-audit
        run: gem install bundler-audit --no-document

      - name: Run bundle-audit
        run: bundle-audit check --update

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub workflows
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - bundler-audit
      - lint-workflows
    if: ${{ always() }}
    steps:
      - name: Verify required checks
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          BUNDLER_AUDIT_RESULT: ${{ needs.bundler-audit.result }}
          LINT_WORKFLOWS_RESULT: ${{ needs.lint-workflows.result }}
        run: |
          echo "dependency-review: ${DEPENDENCY_REVIEW_RESULT}"
          echo "bundler-audit: ${BUNDLER_AUDIT_RESULT}"
          echo "lint-workflows: ${LINT_WORKFLOWS_RESULT}"

          if [ "${DEPENDENCY_REVIEW_RESULT}" != "success" ] || \
             [ "${BUNDLER_AUDIT_RESULT}" != "success" ] || \
             [ "${LINT_WORKFLOWS_RESULT}" != "success" ]; then
            echo "One or more required checks did not succeed."
            exit 1
          fi

          echo "All required status checks completed successfully."