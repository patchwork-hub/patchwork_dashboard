  deploy-newsmast:
    name: Update Newsmast compose file and deploy
    runs-on: ubuntu-latest
    needs: build-dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in docker-compose.ovh.yml
        run: |
          DASHBOARD_IMAGE="${{ env.NEWSMAST_HARBOR_REGISTRY }}/${{ env.NEWSMAST_HARBOR_PROJECT }}/dashboard:${{ env.NEWSMAST_DASHBOARD_IMAGE_TAG }}"

          # Replace any existing dashboard image line, not just the initial placeholder
          sed -i "\|image: .*/dashboard:|c\    image: $DASHBOARD_IMAGE" ${{ env.COMPOSE_FILE }}

          echo "Updated compose file:"
          grep -E "image:" ${{ env.COMPOSE_FILE }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.OVH_SSH_PRIVATE_KEY }}' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Credentials (.env.dashboard) live in /home/ubuntu/deployment/credential/ and are placed
      # manually; CI never writes them.
      - name: Login to OVH Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEWSMAST_HARBOR_REGISTRY }}
          username: ${{ env.NEWSMAST_HARBOR_USERNAME }}
          password: ${{ secrets.NEWSMAST_HARBOR_PASSWORD }}

      - name: Deploy Newsmast dashboard to OVH server
        env:
          DEPLOY_HOST: ${{ vars.NEWSMAST_SERVER_IP }}
        run: |
          # Trim any accidental whitespace/newlines from the org variable
          HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          SSH_OPTS="-i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS ubuntu@$HOST "mkdir -p /home/ubuntu/deployment/dashboard ~/.docker"
          scp $SSH_OPTS ${{ env.COMPOSE_FILE }} ubuntu@$HOST:/home/ubuntu/deployment/dashboard/${{ env.COMPOSE_FILE }}
          scp $SSH_OPTS ~/.docker/config.json ubuntu@$HOST:~/.docker/config.json
          ssh $SSH_OPTS ubuntu@$HOST \
            "set -e; cd /home/ubuntu/deployment/dashboard; docker compose -f ${{ env.COMPOSE_FILE }} pull; docker compose -f ${{ env.COMPOSE_FILE }} up -d"
